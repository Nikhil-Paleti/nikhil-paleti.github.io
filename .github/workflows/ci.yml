name: Validate Site

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Install browser for visual QA
        run: npx playwright install --with-deps chromium

      - name: Browser QA
        run: npm run test:browser

      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-screenshots
          path: test-results/screenshots
          if-no-files-found: ignore
          retention-days: 7
